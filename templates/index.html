<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ bot_name }}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #07111f;
            --panel: rgba(13, 27, 42, 0.86);
            --panel-soft: rgba(20, 38, 57, 0.72);
            --border: rgba(148, 163, 184, 0.15);
            --text: #f8fafc;
            --muted: #91a4b8;
            --cyan: #22d3ee;
            --blue: #3b82f6;
            --purple: #8b5cf6;
        }

        body {
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 12%, rgba(34, 211, 238, 0.16), transparent 25%),
                radial-gradient(circle at 88% 82%, rgba(139, 92, 246, 0.18), transparent 28%),
                var(--background);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: min(1080px, 100%);
            height: min(760px, 94vh);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: var(--panel);
            backdrop-filter: blur(24px);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 19px 23px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .logo {
            width: 45px;
            height: 45px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
            font-size: 23px;
            box-shadow: 0 8px 28px rgba(34, 211, 238, 0.2);
        }

        .brand h1 {
            font-size: 18px;
        }

        .status {
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 11px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.75);
        }

        .scope {
            color: #bae6fd;
            border: 1px solid rgba(34, 211, 238, 0.18);
            background: rgba(34, 211, 238, 0.06);
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 11px;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            scroll-behavior: smooth;
        }

        .welcome {
            max-width: 690px;
            margin: 65px auto;
            text-align: center;
        }

        .atom {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 25px;
            border: 1px solid var(--border);
            background: linear-gradient(
                135deg,
                rgba(34, 211, 238, 0.13),
                rgba(139, 92, 246, 0.13)
            );
            font-size: 34px;
        }

        .welcome h2 {
            font-size: clamp(28px, 5vw, 45px);
            line-height: 1.08;
            margin-bottom: 12px;
        }

        .welcome p {
            color: var(--muted);
            line-height: 1.7;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
            animation: appear 0.2s ease;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: min(760px, 85%);
            padding: 14px 17px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--panel-soft);
            line-height: 1.65;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user .bubble {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-color: transparent;
            border-bottom-right-radius: 6px;
        }

        .bot .bubble {
            border-bottom-left-radius: 6px;
        }

        .composer {
            padding: 17px 22px 21px;
            border-top: 1px solid var(--border);
            background: rgba(5, 15, 28, 0.45);
        }

        .input-wrap {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 9px;
            border: 1px solid var(--border);
            border-radius: 21px;
            background: rgba(10, 24, 39, 0.88);
        }

        textarea {
            flex: 1;
            min-height: 46px;
            max-height: 140px;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            padding: 12px 10px;
            font: inherit;
            line-height: 1.45;
        }

        textarea::placeholder {
            color: #64748b;
        }

        button {
            border: 0;
            cursor: pointer;
            color: white;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            transform: none;
        }

        .send {
            width: 46px;
            height: 46px;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
            font-size: 18px;
        }

        .hint {
            margin-top: 9px;
            text-align: center;
            color: #64748b;
            font-size: 11px;
        }

        .typing {
            display: inline-flex;
            gap: 5px;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #94a3b8;
            animation: pulse 1s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            40% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 0;
            }

            .app {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .chat {
                padding: 20px 15px;
            }

            .composer {
                padding: 13px;
            }

            .bubble {
                max-width: 92%;
            }

            .welcome {
                margin: 40px auto;
            }

            .scope {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header class="header">
            <div class="brand">
                <div class="logo">⚗</div>
                <div>
                    <h1>{{ bot_name }}</h1>
                    <div class="status">
                        <span class="status-dot"></span>
                        Chemistry study mode
                    </div>
                </div>
            </div>

            <div class="scope">CHEMISTRY ONLY</div>
        </header>

        <section class="chat" id="chat">
            <div class="welcome" id="welcome">
                <div class="atom">⚛</div>
                <h2>Explore Chemistry.</h2>
                <p>
                    Ask about chemical reactions, equations, atomic structure,
                    organic chemistry, physical chemistry, calculations,
                    assignments, or exam preparation.
                </p>
            </div>
        </section>

        <footer class="composer">
            <form class="input-wrap" id="chat-form">
                <textarea
                    id="message"
                    rows="1"
                    placeholder="Ask a Chemistry question..."
                    autocomplete="off"
                ></textarea>

                <button
                    class="send"
                    id="send"
                    type="submit"
                    aria-label="Send message"
                >
                    ➤
                </button>
            </form>

            <div class="hint">
                Chemistry-focused educational assistant
            </div>
        </footer>
    </main>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const chat = document.getElementById("chat");
        const send = document.getElementById("send");
        const welcome = document.getElementById("welcome");

        function addMessage(text, role) {
            if (welcome) {
                welcome.remove();
            }

            const message = document.createElement("div");
            message.className = `message ${role}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;

            message.appendChild(bubble);
            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;
        }

        function showTyping() {
            const message = document.createElement("div");
            message.className = "message bot";
            message.id = "typing";

            const bubble = document.createElement("div");
            bubble.className = "bubble";

            const typing = document.createElement("div");
            typing.className = "typing";
            typing.innerHTML = "<span></span><span></span><span></span>";

            bubble.appendChild(typing);
            message.appendChild(bubble);
            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = input.value.trim();

            if (!message || send.disabled) {
                return;
            }

            addMessage(message, "user");

            input.value = "";
            input.style.height = "auto";
            send.disabled = true;
            showTyping();

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                document.getElementById("typing")?.remove();

                if (!response.ok) {
                    addMessage(
                        data.error || "Something went wrong.",
                        "bot"
                    );
                    return;
                }

                addMessage(data.reply, "bot");
            } catch (error) {
                document.getElementById("typing")?.remove();
                addMessage(
                    "Unable to connect to the chatbot right now.",
                    "bot"
                );
            } finally {
                send.disabled = false;
                input.focus();
            }
        });

        input.addEventListener("input", () => {
            input.style.height = "auto";
            input.style.height = `${Math.min(input.scrollHeight, 140)}px`;
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });
    </script>
</body>
</html>
